<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Served from a subpath on GitHub Pages, so the value is supplied by
    `flutter build web --base-href /<repo>/`. It must start and end with "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Preview build of Kumus Tambay, a student place finder for Malinta, Valenzuela City.">
  <meta name="theme-color" content="#1F6FD1">

  <!-- The preview is unlisted, not secret: listing data and coordinates are
       publicly readable. This only keeps it out of search results. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kumus Tambay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kumus Tambay</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Matches AppColors.background so the first paint is not a white flash. */
    html, body {
      margin: 0;
      background-color: #FBF8F4;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
